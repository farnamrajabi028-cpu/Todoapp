{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام - مدیریت تسک‌ها</title>
    <link rel="stylesheet" href="{% static 'todoapplication/auth_style.css' %}">
    <style>
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
            font-family: inherit;
        }
        .btn-submit:hover:not(:disabled) {
            background-color: #4f46e5;
        }
        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>ساخت حساب جدید</h2>
            <p class="subtitle">برای مدیریت تسک ها خود یک حساب کاربری بسازید.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">نام کاربری</label>
                    <input type="text" id="username-input" name="username" required autocomplete="username" autofocus>
                    <small id="username-feedback" style="display: block; margin-top: 6px; font-size: 13px; font-weight: 500;"></small>
                </div>

                <div class="form-group">
                    <label for="email">ایمیل</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="password_confirm">تکرار رمز عبور</label>
                    <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-submit">ثبت نام</button>
            </form>

            <div class="auth-footer" style="margin-top: 20px; text-align: center;">
                <span>حساب کاربری دارید؟</span>
                <a href="{% url 'login' %}" style="color: #6366f1; text-decoration: none; font-weight: 600; margin-right: 5px;">وارد شوید</a>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const usernameInput = document.getElementById("username-input");
        const feedback = document.getElementById("username-feedback");
        const submitBtn = document.getElementById("submit-btn");

        if (usernameInput && feedback) {
            let debounceTimer;
            usernameInput.addEventListener("input", function() {
                clearTimeout(debounceTimer);
                const val = this.value.trim();

                if (val.length === 0) {
                    feedback.textContent = "";
                    if (submitBtn) submitBtn.disabled = false;
                    return;
                }

                debounceTimer = setTimeout(() => {
                    fetch(`/check-username/?username=${encodeURIComponent(val)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.exists) {
                                feedback.textContent = "این نام کاربری قبلاً استفاده شده است.";
                                feedback.style.color = "#ef4444";
                                if (submitBtn) submitBtn.disabled = true;
                            } else {
                                feedback.textContent = "این نام کاربری آزاد است.";
                                feedback.style.color = "#10b981";
                                if (submitBtn) submitBtn.disabled = false;
                            }
                        })
                        .catch(err => console.error("Error:", err));
                }, 300);
            });
        }
    });
    </script>
</body>
</html>
